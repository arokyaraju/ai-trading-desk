services:
  - type: web
    name: ai-trading-desk
    env: python
    rootDir: ai_trading_desk
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-desk-db
          property: connectionString
      - key: FYERS_APP_ID
        value: "77WFZ67AWG-200"
      - key: FYERS_SECRET_KEY
        value: "PGLvsC6gLCFjJjA4"
      - key: FYERS_ACCESS_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RISK_PER_TRADE_INR
        value: "1000.0"
      - key: MIN_RISK_REWARD
        value: "1.5"

databases:
  - name: trading-desk-db
    databaseName: trading_desk
    user: desk_user
    plan: free
